name: Build TreeCapacitor (MC 1.26.33.1)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Configure and build mod
        run: |
          echo "Configuring TreeCapacitor..."
          cmake -B build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release

          echo "Building TreeCapacitor..."
          cmake --build build --config Release

      - name: Package LeviPack
        run: |
          python3 scripts/package_levipack.py --library build/libtree_capacitor.so --icon assets/icon.png --output TreeCapacitator.levipack
          ls -la TreeCapacitator.levipack build/libtree_capacitor.so
          python3 scripts/verify_levipack.py TreeCapacitator.levipack

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TreeCapacitator-mc1.26.33.1-arm64
          path: |
            TreeCapacitator.levipack
            build/libtree_capacitor.so
          if-no-files-found: error
          retention-days: 90
